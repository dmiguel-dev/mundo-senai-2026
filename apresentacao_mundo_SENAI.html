dat:()=>{
  const T=(x,y,t,f=13,c='#fff',w=700)=>`<text x=${x} y=${y} font-size=${f} font-weight=${w} text-anchor="middle" fill="${c}">${t}</text>`;

  s+=T(62,20,'1. Dados brutos',14)+T(200,20,'2. Limpeza',14)+T(338,20,'3. Gráficos',14);
  [10,148,286].forEach(x=>s+=`<rect x=${x} y=30 width=104 height=100 rx=8 fill="#1B2A63" stroke="#38E1FF"/>`);
  const C=['#FFB27A','#9CCBFF','#fff','#8A94A3','#38E1FF'];
  for(let k=0;k<14;k++){
    const x=20+(k*37)%84,y=40+(k*53)%76;

  }
  s+=`<polygon points="160,42 240,42 214,92 186,92" fill="rgba(56,225,255,.18)" stroke="#38E1FF"/>`;
  [[172,'#FFB27A',0],[200,'#9CCBFF',.7],[228,'#FFFFFF',1.4]].forEach(([x,c,d])=>s+=`<circle r=4 cx=${x} cy=40 fill="${c}"><animate attributeName="cy" values="38;92;122" keyTimes="0;.65;1" dur="2.1s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="cx" values="${x};200;200" keyTimes="0;.65;1" dur="2.1s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="fill" values="${c};${c};#38E1FF" keyTimes="0;.65;1" dur="2.1s" begin="${d}s" repeatCount="indefinite"/></circle>`);
  for(let k=0;k<6;k++)s+=`<rect x=${164+k*12} y=118 width=8 height=8 fill="#38E1FF" opacity=".55"/>`;
  [[117,142],[255,280]].forEach(([x1,x2])=>s+=`<path d="M${x1} 80H${x2-4}" stroke="#FFB27A" stroke-width=3 stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="22;0" dur=".8s" repeatCount="indefinite"/></path><polygon points="${x2-4},73 ${x2+3},80 ${x2-4},87" fill="#FFB27A"/>`);
  s+='<path d="M296 123H384" stroke="#9CCBFF"/>';
  [30,52,40,68,56].forEach((h,k)=>s+=`<rect class=gr x=${300+k*18} y=${122-h} width=12 height=${h} fill="#38E1FF" style="--d:${-k*.5}s"/>`);
